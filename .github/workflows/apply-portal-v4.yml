name: Apply portal v4 migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-portal-v4.yml'
      - '.deploy/portal-v4-trigger.txt'
      - 'src/FileExplorer.jsx'
      - 'src/file-explorer.css'
      - 'src/DocumentScanner.jsx'
      - 'src/document-scanner.css'
      - 'src/MemberPollAdmin.jsx'
      - 'scripts/apply-file-explorer.py'
      - 'scripts/apply-scanner-and-fixes.py'
      - 'scripts/apply-member-portal-ux.py'
      - 'scripts/apply-preview-poll-admin.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply portal v4 migration
        run: python scripts/apply-portal-v4.py
      - name: Fix idempotency and add document scanner
        run: python scripts/apply-scanner-and-fixes.py
      - name: Apply hierarchical file explorer
        run: python scripts/apply-file-explorer.py
      - name: Apply member portal UX fixes
        run: python scripts/apply-member-portal-ux.py
      - name: Apply role preview and poll analytics
        run: python scripts/apply-preview-poll-admin.py
      - name: Install and verify STRATO build
        run: |
          npm install
          npm run build:strato
      - name: Commit portal v4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src api
          git commit -m "Add role preview and member poll analytics" || exit 0
          git push

name: Integrate email verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-email-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend and portal
        shell: python
        run: |
          from pathlib import Path

          p = Path('api/index.php')
          s = p.read_text()
          s = s.replace("require __DIR__ . '/lib.php';", "require __DIR__ . '/lib.php';\nrequire __DIR__ . '/account.php';", 1)

          old = """        $stmt = db()->prepare('SELECT id, email, name, role, active, password_hash FROM users WHERE email = ? LIMIT 1');
        $stmt->execute([$email]);
        $user = $stmt->fetch();
        $valid = $user && (int)$user['active'] === 1 && password_verify($password, (string)$user['password_hash']);

        if (!$valid) {"""
          new = """        ensure_account_security_schema();
        $stmt = db()->prepare('SELECT id, email, name, role, active, email_verified_at, password_hash FROM users WHERE email = ? LIMIT 1');
        $stmt->execute([$email]);
        $user = $stmt->fetch();
        $passwordValid = $user && password_verify($password, (string)$user['password_hash']);
        $valid = $passwordValid && (int)$user['active'] === 1;

        if ($passwordValid && (int)$user['active'] === 1 && empty($user['email_verified_at'])) {
            json_response(['ok' => false, 'code' => 'EMAIL_NOT_VERIFIED', 'message' => 'Bitte bestätige zuerst deine E-Mail-Adresse. Du kannst dir den Bestätigungslink erneut zusenden lassen.'], 403);
        }

        if (!$valid) {"""
          if old not in s: raise SystemExit('login block not found')
          s = s.replace(old, new, 1)

          old = """        $hash = password_hash($password, PASSWORD_DEFAULT);
        try {
            db()->prepare('INSERT INTO users (email, name, password_hash, role, active, updated_at) VALUES (?, ?, ?, ?, 1, NOW())')->execute([$email, $name, $hash, $role]);"""
          new = """        ensure_account_security_schema();
        $hash = password_hash($password, PASSWORD_DEFAULT);
        try {
            db()->prepare('INSERT INTO users (email, name, password_hash, role, active, email_verified_at, updated_at) VALUES (?, ?, ?, ?, 1, NOW(), NOW())')->execute([$email, $name, $hash, $role]);"""
          if old not in s: raise SystemExit('admin create block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/PortalRoot.jsx')
          s = p.read_text()
          s = s.replace("import { cloudEnabled, getSession, onAuthChange, registerSelf, signInWithEmail } from './lib/projectStore.js'", "import { accountUrl, cloudEnabled, getSession, onAuthChange, registerSelf, signInWithEmail } from './lib/projectStore.js'")

          old = """    try {
      const session = await registerSelf(register)
      onAuthenticated(session)
    } catch (error) {
      setMessage(error.message)
    } finally { setBusy(false) }"""
          new = """    try {
      const result = await registerSelf(register)
      setMode('login')
      setLogin({ email: register.email, password: '' })
      setRegister({ name: '', email: '', password: '', password2: '', privacyAccepted: false })
      setMessage(result.message || 'Konto angelegt. Bitte bestätige deine E-Mail-Adresse über den Link in deinem Postfach.')
    } catch (error) {
      setMessage(error.message)
    } finally { setBusy(false) }"""
          if old not in s: raise SystemExit('register submit block not found')
          s = s.replace(old, new, 1)

          old = """        <label>Passwort<input type=\"password\" required autoComplete=\"current-password\" value={login.password} onChange={(e) => setLogin({ ...login, password: e.target.value })} /></label>
        <button className=\"portal-primary full\" disabled={busy}>{busy ? 'Anmeldung läuft …' : 'Anmelden'} <ArrowRight size={16} /></button>"""
          new = """        <label>Passwort<input type=\"password\" required autoComplete=\"current-password\" value={login.password} onChange={(e) => setLogin({ ...login, password: e.target.value })} /></label>
        <div className=\"portal-account-links\"><a href={accountUrl('reset.php')}>Passwort vergessen?</a><a href={accountUrl('resend.php')}>Bestätigungs-Mail erneut senden</a></div>
        <button className=\"portal-primary full\" disabled={busy}>{busy ? 'Anmeldung läuft …' : 'Anmelden'} <ArrowRight size={16} /></button>"""
          if old not in s: raise SystemExit('login form block not found')
          s = s.replace(old, new, 1)

          marker = "  const [register, setRegister] = useState({ name: '', email: '', password: '', password2: '', privacyAccepted: false })\n"
          inject = marker + "\n  useEffect(() => {\n    const params = new URLSearchParams(window.location.search)\n    const verification = params.get('verification')\n    if (!verification) return\n    setAuthOpen(true)\n    setMode('login')\n    setMessage(verification === 'success' ? 'E-Mail-Adresse bestätigt. Du kannst dich jetzt anmelden.' : verification === 'invalid' ? 'Der Bestätigungslink ist ungültig oder abgelaufen. Bitte fordere einen neuen an.' : 'Die E-Mail-Bestätigung konnte nicht abgeschlossen werden.')\n    window.history.replaceState({}, '', window.location.pathname + window.location.hash)\n  }, [])\n"
          if marker not in s: raise SystemExit('state marker not found')
          s = s.replace(marker, inject, 1)
          p.write_text(s)

          p = Path('src/portal.css')
          s = p.read_text()
          s += "\n.portal-account-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-2px 0 4px}.portal-account-links a{font-size:.82rem;color:var(--portal-accent,#6e3aa8);text-decoration:none}.portal-account-links a:hover{text-decoration:underline}\n"
          p.write_text(s)
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index.php src/PortalRoot.jsx src/portal.css
          git commit -m "Integrate STRATO email verification and reset flow" || exit 0
          git push

# one-time integration trigger 2026-09-15

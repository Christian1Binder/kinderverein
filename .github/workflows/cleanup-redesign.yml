name: Cleanup and redesign WeKiB portal

on:
  push:
    branches: [main]
    paths:
      - '.maintenance/cleanup-redesign.py'
      - '.github/workflows/cleanup-redesign.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply cleanup and redesign
        run: python .maintenance/cleanup-redesign.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build STRATO package
        env:
          VITE_APP_ENV: lab
        run: npm run build:strato

      - name: Validate PHP syntax
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Commit cleaned portal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up portal architecture and refresh design"
          git push

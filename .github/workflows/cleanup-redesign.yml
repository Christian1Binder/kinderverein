name: Cleanup and redesign WeKiB portal

on:
  push:
    branches: [main]
    paths:
      - '.maintenance/cleanup-redesign.py'
      - '.github/workflows/cleanup-redesign.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare migration without workflow writes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.maintenance/cleanup-redesign.py')
          s = p.read_text()
          marker = "]:                                                                \n    unlink(path)\n\n# ---------------------------------------------------------------------------\n# Single Vite entry"
          # Tolerant replacement: only the cleanup-list call is indented exactly four spaces.
          s = s.replace("]:                                                                \n    unlink(path)\n", "]:                                                                \n    if not path.startswith('.github/workflows/'):\n        unlink(path)\n", 1)
          if "    if not path.startswith('.github/workflows/'):" not in s:
              s = s.replace("    unlink(path)\n\n# ---------------------------------------------------------------------------\n# Single Vite entry", "    if not path.startswith('.github/workflows/'):\n        unlink(path)\n\n# ---------------------------------------------------------------------------\n# Single Vite entry", 1)
          start = s.find("for workflow in ['.github/workflows/build-strato.yml'")
          end = s.find("\nwrite('README.md'", start)
          if start != -1 and end != -1:
              s = s[:start] + "# Workflow files are maintained separately through the GitHub connector.\n" + s[end:]
          s = s.replace("unlink('.github/workflows/cleanup-redesign.yml')\n", "")
          p.write_text(s)
          PY

      - name: Apply cleanup and redesign
        run: python .maintenance/cleanup-redesign.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build STRATO package
        env:
          VITE_APP_ENV: lab
        run: npm run build:strato

      - name: Validate PHP syntax
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Commit cleaned portal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up portal architecture and refresh design"
          git push

name: One-time document hub migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-document-hub.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch document workspace
        run: python scripts/patch-document-hub.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV2.jsx src/production.css
          git commit -m "Unify documents with uploads and downloads"
          git push

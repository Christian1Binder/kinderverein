name: Build STRATO package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/build-strato.yml'
  workflow_dispatch:

jobs:
  build-strato:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build STRATO package
        env:
          VITE_APP_ENV: package
        run: npm run build:strato

      - name: Add build metadata
        run: |
          printf '{"environment":"package","source_sha":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-strato/deployment-info.json

      - name: Upload STRATO build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinderverein-strato
          path: dist-strato/
          if-no-files-found: error

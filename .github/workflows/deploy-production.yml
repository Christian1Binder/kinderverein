name: Deploy tested version to PROD

on:
  push:
    branches: [main]
    paths:
      - '.deploy/production-source.txt'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact tested LAB commit SHA (40 characters). Leave empty to use .deploy/production-source.txt.'
        required: false
        type: string

env:
  STRATO_HOST: ${{ secrets.STRATO_PROD_HOST }}
  STRATO_USER: ${{ secrets.STRATO_PROD_USER }}
  STRATO_PASSWORD: ${{ secrets.STRATO_PROD_PASSWORD }}
  STRATO_REMOTE_PATH: ${{ secrets.STRATO_PROD_REMOTE_PATH }}
  REQUESTED_SHA: ${{ github.event.inputs.source_sha }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tested source version
        shell: bash
        run: |
          if [ -n "${REQUESTED_SHA:-}" ]; then
            SOURCE_SHA="${REQUESTED_SHA}"
          else
            SOURCE_SHA="$(tr -d '[:space:]' < .deploy/production-source.txt)"
          fi

          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Invalid production source SHA: $SOURCE_SHA"
            exit 1
          fi

          git cat-file -e "${SOURCE_SHA}^{commit}" 2>/dev/null || git fetch origin "$SOURCE_SHA"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git checkout --detach "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "Promoting tested LAB commit $SOURCE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production package
        env:
          VITE_APP_ENV: production
        run: npm run build:strato

      - name: Add deployment metadata
        run: |
          printf '{"environment":"production","source_sha":"%s","built_at":"%s"}\n' "$SOURCE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-strato/deployment-info.json

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinderverein-strato-production
          path: dist-strato/
          if-no-files-found: error

      - name: Install SFTP client
        if: ${{ env.STRATO_HOST != '' && env.STRATO_USER != '' && env.STRATO_PASSWORD != '' }}
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy tested version to PROD
        if: ${{ env.STRATO_HOST != '' && env.STRATO_USER != '' && env.STRATO_PASSWORD != '' }}
        run: |
          TARGET="${STRATO_REMOTE_PATH:-.}"
          lftp -u "$STRATO_USER,$STRATO_PASSWORD" "sftp://$STRATO_HOST:22" -e "set sftp:auto-confirm yes; mirror -R --verbose --exclude-glob api/private/config.php dist-strato/ $TARGET; bye"

      - name: PROD connection not configured
        if: ${{ env.STRATO_HOST == '' || env.STRATO_USER == '' || env.STRATO_PASSWORD == '' }}
        run: echo "Production build created. Add STRATO_PROD_* repository secrets to enable automatic deployment."

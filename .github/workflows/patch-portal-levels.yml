name: Apply portal access levels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-portal-levels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply access-level patch
        shell: python
        run: |
          from pathlib import Path

          # Backend: enforce data-level access, not only hidden navigation.
          p = Path('api/index.php')
          s = p.read_text()
          if "require __DIR__ . '/access.php';" not in s:
              s = s.replace("require __DIR__ . '/lib.php';", "require __DIR__ . '/lib.php';\nrequire __DIR__ . '/access.php';", 1)
          old = """    if ($action === 'state' && $method === 'GET') {
        require_user();
        $stmt = db()->prepare('SELECT data, updated_at FROM project_state WHERE id = ? LIMIT 1');
        $stmt->execute(['kinderverein-main']);
        $row = $stmt->fetch();
        json_response(['ok' => true, 'data' => $row ? json_decode((string)$row['data'], true) : null, 'updatedAt' => $row['updated_at'] ?? null]);
    }"""
          new = """    if ($action === 'state' && $method === 'GET') {
        $user = require_user();
        $stmt = db()->prepare('SELECT data, updated_at FROM project_state WHERE id = ? LIMIT 1');
        $stmt->execute(['kinderverein-main']);
        $row = $stmt->fetch();
        $data = $row ? json_decode((string)$row['data'], true) : null;
        if (is_array($data)) $data = filter_project_state_for_user($data, $user);
        json_response(['ok' => true, 'data' => $data, 'updatedAt' => $row['updated_at'] ?? null]);
    }"""
          if old not in s: raise SystemExit('state GET block not found')
          s = s.replace(old, new, 1)

          old = """        $input = json_input();
        $data = $input['data'] ?? null;
        if (!is_array($data)) json_response(['ok' => false, 'message' => 'Ungültiger Projektstand.'], 400);
        $json = json_encode($data, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);"""
          new = """        $input = json_input();
        $data = $input['data'] ?? null;
        if (!is_array($data)) json_response(['ok' => false, 'message' => 'Ungültiger Projektstand.'], 400);
        if (($user['role'] ?? '') !== 'admin') {
            $stmtCurrent = db()->prepare('SELECT data FROM project_state WHERE id = ? LIMIT 1');
            $stmtCurrent->execute(['kinderverein-main']);
            $rowCurrent = $stmtCurrent->fetch();
            $currentData = $rowCurrent && is_string($rowCurrent['data'] ?? null) ? json_decode((string)$rowCurrent['data'], true) : [];
            $data = merge_project_state_for_user(is_array($currentData) ? $currentData : [], $data, $user);
        }
        $json = json_encode($data, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);"""
          if old not in s: raise SystemExit('state PUT block not found')
          s = s.replace(old, new, 1)

          s = s.replace("        $user = require_user();\n        if (($user['role'] ?? '') === 'viewer') json_response(['ok' => false, 'message' => 'Dieser Zugang hat keine Upload-Berechtigung.'], 403);\n        if (!isset($_FILES['file'])", "        $user = require_user();\n        if (($user['role'] ?? '') === 'viewer') json_response(['ok' => false, 'message' => 'Dieser Zugang hat keine Upload-Berechtigung.'], 403);\n        $portalAccess = portal_access_for_user($user);\n        if (!$portalAccess['foundation'] && !$portalAccess['board'] && !$portalAccess['admin']) json_response(['ok' => false, 'message' => 'Keine Berechtigung für die interne Dateiablage.'], 403);\n        if (!isset($_FILES['file'])", 1)
          s = s.replace("    if ($action === 'file-download' && $method === 'GET') {\n        require_user();", "    if ($action === 'file-download' && $method === 'GET') {\n        $user = require_user();\n        $portalAccess = portal_access_for_user($user);\n        if (!$portalAccess['foundation'] && !$portalAccess['board'] && !$portalAccess['admin']) { http_response_code(403); exit('Keine Berechtigung.'); }", 1)
          p.write_text(s)

          # Admin backend: explicit area access rights.
          p = Path('src/AdminBackend.jsx')
          s = p.read_text()
          marker = "export const PERMISSIONS = [\n"
          if "access_foundation" not in s:
              s = s.replace(marker, marker + "  ['access_foundation', 'Bereich Gründung', 'Öffnet den internen Arbeitsraum für Gründungsmitglieder.'],\n  ['access_board', 'Bereich Vorstand', 'Öffnet den vertraulichen Vorstandsbereich.'],\n", 1)
          s = s.replace("  if (kind === 'founder') return {\n    documents_edit: true,", "  if (kind === 'founder') return {\n    access_foundation: true,\n    access_board: false,\n    documents_edit: true,", 1)
          p.write_text(s)

          # Portal app: show progressively deeper navigation based on access.
          p = Path('src/AppV2.jsx')
          s = p.read_text()
          s = s.replace("const NAV = [\n  ['dashboard', 'Übersicht', LayoutDashboard],", "const FOUNDATION_NAV = [", 1)
          s = s.replace("  return getProfile(project, user)?.kind || 'founder'", "  return getProfile(project, user)?.kind || 'member'", 1)
          s = s.replace("  founder: { documents_edit: true, documents_finalize: true, files_manage: true, tasks_manage: true, polls_create: true, calendar_manage: true, decisions_manage: true, cms_manage: false },", "  founder: { access_foundation: true, access_board: false, documents_edit: true, documents_finalize: true, files_manage: true, tasks_manage: true, polls_create: true, calendar_manage: true, decisions_manage: true, cms_manage: false },", 1)
          s = s.replace("  member: { documents_edit: false, documents_finalize: false, files_manage: false, tasks_manage: false, polls_create: false, calendar_manage: false, decisions_manage: false, cms_manage: false },", "  member: { access_foundation: false, access_board: false, documents_edit: false, documents_finalize: false, files_manage: false, tasks_manage: false, polls_create: false, calendar_manage: false, decisions_manage: false, cms_manage: false },", 1)
          s = s.replace("  viewer: { documents_edit: false, documents_finalize: false, files_manage: false, tasks_manage: false, polls_create: false, calendar_manage: false, decisions_manage: false, cms_manage: false },", "  viewer: { access_foundation: false, access_board: false, documents_edit: false, documents_finalize: false, files_manage: false, tasks_manage: false, polls_create: false, calendar_manage: false, decisions_manage: false, cms_manage: false },", 1)

          old = """  const profile = getProfile(project, user)
  const kind = memberKind(project, user)
  const onboardingDone = project.onboarding[user.email]?.done

  const searchResults = buildSearchResults(project, search)"""
          new = """  const profile = getProfile(project, user)
  const kind = memberKind(project, user)
  const onboardingDone = project.onboarding[user.email]?.done
  const isAdmin = user.role === 'admin'
  const canFoundation = isAdmin || kind === 'founder' || hasPermission(project, user, 'access_foundation')
  const canBoard = isAdmin || hasPermission(project, user, 'access_board')
  const canCms = isAdmin || hasPermission(project, user, 'cms_manage')

  const searchResults = canFoundation || canBoard ? buildSearchResults(project, search) : []"""
          if old not in s: raise SystemExit('access state marker not found')
          s = s.replace(old, new, 1)

          old = """        <nav className=\"nav-stack\">
          {NAV.map(([id, label, Icon]) => (
            <button key={id} className={`nav-item ${page === id ? 'active' : ''}`} onClick={() => go(id)}><Icon size={18} /><span>{label}</span></button>
          ))}
          {(user.role === 'admin' || hasPermission(project, user, 'cms_manage')) && <button className={`nav-item ${page === 'studio' ? 'active' : ''}`} onClick={() => go('studio')}><Shield size={18} /><span>Admin</span></button>}
        </nav>"""
          new = """        <nav className=\"nav-stack\">
          <button className={`nav-item ${page === 'dashboard' ? 'active' : ''}`} onClick={() => go('dashboard')}><LayoutDashboard size={18} /><span>Mein WeKiB</span></button>
          {canFoundation && <><div className=\"nav-section-label\">GRÜNDUNG</div>{FOUNDATION_NAV.map(([id, label, Icon]) => (
            <button key={id} className={`nav-item ${page === id ? 'active' : ''}`} onClick={() => go(id)}><Icon size={18} /><span>{label}</span></button>
          ))}</>}
          {canBoard && <><div className=\"nav-section-label\">VORSTAND</div><button className={`nav-item ${page === 'board' ? 'active' : ''}`} onClick={() => go('board')}><LockKeyhole size={18} /><span>Vorstandsbereich</span></button></>}
          {canCms && <><div className=\"nav-section-label\">VERWALTUNG</div><button className={`nav-item ${page === 'studio' ? 'active' : ''}`} onClick={() => go('studio')}><SlidersHorizontal size={18} /><span>CMS</span></button></>}
          {isAdmin && <button className={`nav-item ${page === 'admin' ? 'active' : ''}`} onClick={() => go('admin')}><Shield size={18} /><span>Administration</span></button>}
        </nav>"""
          if old not in s: raise SystemExit('nav block not found')
          s = s.replace(old, new, 1)

          old = """          {page === 'dashboard' && <Dashboard project={project} user={user} mutate={mutate} go={go} />}
          {page === 'tasks' && <Tasks project={project} user={user} mutate={mutate} />}
          {page === 'documents' && <Documents project={project} user={user} mutate={mutate} setToast={setToast} />}
          {page === 'files' && <Files project={project} user={user} mutate={mutate} setToast={setToast} />}
          {page === 'polls' && <PollsWithImages project={project} user={user} mutate={mutate} setToast={setToast} canCreate={hasPermission(project, user, 'polls_create')} />}
          {page === 'calendar' && <Calendar project={project} user={user} mutate={mutate} />}
          {page === 'members' && <Members project={project} user={user} mutate={mutate} setToast={setToast} />}
          {page === 'decisions' && <Decisions project={project} user={user} mutate={mutate} />}
          {page === 'activity' && <ActivityPage project={project} />}
          {page === 'studio' && (user.role === 'admin' || hasPermission(project, user, 'cms_manage')) && <AdminBackend project={project} user={user} mutate={mutate} setToast={setToast} />}
          {page === 'profile' && <Profile project={project} user={user} mutate={mutate} />}"""
          new = """          {page === 'dashboard' && (canFoundation ? <Dashboard project={project} user={user} mutate={mutate} go={go} /> : <MemberDashboard user={user} profile={profile} canBoard={canBoard} canCms={canCms} />)}
          {canFoundation && page === 'tasks' && <Tasks project={project} user={user} mutate={mutate} />}
          {canFoundation && page === 'documents' && <Documents project={project} user={user} mutate={mutate} setToast={setToast} />}
          {canFoundation && page === 'files' && <Files project={project} user={user} mutate={mutate} setToast={setToast} />}
          {canFoundation && page === 'polls' && <PollsWithImages project={project} user={user} mutate={mutate} setToast={setToast} canCreate={hasPermission(project, user, 'polls_create')} />}
          {canFoundation && page === 'calendar' && <Calendar project={project} user={user} mutate={mutate} />}
          {canFoundation && page === 'members' && <Members project={project} user={user} mutate={mutate} setToast={setToast} />}
          {canFoundation && page === 'decisions' && <Decisions project={project} user={user} mutate={mutate} />}
          {canFoundation && page === 'activity' && <ActivityPage project={project} />}
          {canBoard && page === 'board' && <BoardArea />}
          {canCms && page === 'studio' && <AdminBackend project={project} user={user} mutate={mutate} setToast={setToast} initialTab=\"cms\" />}
          {isAdmin && page === 'admin' && <AdminBackend project={project} user={user} mutate={mutate} setToast={setToast} initialTab=\"users\" />}
          {page === 'profile' && <Profile project={project} user={user} mutate={mutate} />}"""
          if old not in s: raise SystemExit('content block not found')
          s = s.replace(old, new, 1)

          marker = "function LoadingScreen() {"
          inject = """function MemberDashboard({ user, profile, canBoard, canCms }) {
  return <div className=\"page\"><PageHeader eyebrow=\"MEIN WEKIB\" title={`Willkommen, ${firstName(profile?.displayName || user.name || user.email)}`} description=\"Dein persönlicher Zugang zum WeKiB-Portal. Interne Arbeitsbereiche erscheinen hier erst nach Freigabe.\" />
    <section className=\"hero-panel\"><div><p className=\"eyebrow\">PORTALZUGANG</p><h2>Dein Konto ist aktiv.</h2><p>Du siehst nur die Bereiche, für die dein Konto freigeschaltet wurde. Gründungsunterlagen und Vorstandsunterlagen bleiben geschützt.</p></div><div className=\"hero-phase\"><span>DEIN ZUGANG</span><strong>Mein WeKiB</strong><small>{canBoard ? 'Vorstand freigeschaltet' : canCms ? 'CMS freigeschaltet' : 'Basiszugang'}</small></div></section>
    <section className=\"metric-grid\"><Metric label=\"Öffentliche Website\" value=\"✓\" hint=\"für alle Besucher\" /><Metric label=\"Mein WeKiB\" value=\"✓\" hint=\"persönlicher Bereich\" /><Metric label=\"Gründung\" value=\"—\" hint=\"nur nach Freigabe\" /><Metric label=\"Vorstand\" value={canBoard ? '✓' : '—'} hint=\"vertraulicher Bereich\" /></section>
  </div>
}

function BoardArea() {
  return <div className=\"page\"><PageHeader eyebrow=\"VERTRAULICH\" title=\"Vorstandsbereich\" description=\"Geschützter Arbeitsraum für Vorstand und ausdrücklich berechtigte Personen.\" /><section className=\"card\"><div className=\"studio-intro\"><LockKeyhole size={21} /><div><strong>Vorstandsunterlagen getrennt vom Gründungsbereich</strong><span>Hier werden künftig Vorstandsdokumente, Beschlüsse, Finanzen und weitere vertrauliche Unterlagen abgelegt.</span></div></div></section></div>
}

""" + marker
          if marker not in s: raise SystemExit('loading marker not found')
          s = s.replace(marker, inject, 1)
          p.write_text(s)

          # Admin can be opened directly on CMS or user management.
          p = Path('src/AdminBackend.jsx')
          s = p.read_text()
          s = s.replace("export default function AdminBackend({ project, user, mutate, setToast }) {", "export default function AdminBackend({ project, user, mutate, setToast, initialTab = null }) {", 1)
          s = s.replace("  const [tab, setTab] = useState(isAdmin ? 'users' : 'cms')", "  const [tab, setTab] = useState(initialTab || (isAdmin ? 'users' : 'cms'))", 1)
          p.write_text(s)

          # Styling for hierarchy labels.
          p = Path('src/v2.css')
          s = p.read_text()
          if '.nav-section-label' not in s:
              s += "\n.nav-section-label{padding:15px 14px 5px;font-size:.64rem;font-weight:800;letter-spacing:.14em;opacity:.48}.sidebar .nav-section-label:first-of-type{margin-top:4px}\n"
          p.write_text(s)

      - name: Commit portal levels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index.php src/AppV2.jsx src/AdminBackend.jsx src/v2.css
          git commit -m "Enforce multi-level portal access" || exit 0
          git push
